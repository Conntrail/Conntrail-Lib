[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conntrail"
version = "0.1.0"
description = "Decision path tracer for LangGraph agents — contrastive routing analysis"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = ["langgraph", "observability", "llm", "agents", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
    "langchain-groq>=1.1.2",
    "langchain-anthropic>=1.4.0",
    "openai>=2.30.0",
    "langchain-openai>=1.1.12",
    "reportlab>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
gepa = [
    "dspy-ai>=2.5.0",
    "gepa>=0.1.0",
]
testing = [
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["conntrail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires live API keys",
    "baseline: agent works without Conntrail",
    "slow: takes > 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
