[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conntrail"
version = "0.1.0"
description = "Decision path tracer for LangGraph agents — contrastive routing analysis"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ibzie", email = "ibrahimakhtar3@gmail.com" }]
maintainers = [{ name = "ibzie", email = "ibrahimakhtar3@gmail.com" }]
keywords = ["langgraph", "observability", "llm", "agents", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

dependencies = [
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "aiofiles>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/ibzie/conntrail"
Documentation = "https://github.com/ibzie/conntrail#readme"
Repository = "https://github.com/ibzie/conntrail"
Issues = "https://github.com/ibzie/conntrail/issues"
Changelog = "https://github.com/ibzie/conntrail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
testing = [
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["conntrail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires live API keys",
    "baseline: agent works without Conntrail",
    "slow: takes > 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
